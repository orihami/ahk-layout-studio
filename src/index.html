<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AHK 配列スタジオ</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body data-view="studio">
<header>
  <h1>⌨ AHK <span>配列スタジオ</span></h1>
  <span class="doc" id="docName" title="クリックでファイル名を変更"></span>
  <button class="btn" id="bOpen" title=".ahk ファイルを開く（画面にドラッグ＆ドロップでもOK）">📂 開く</button>
  <input type="file" id="file" accept=".ahk,.ah2,.txt" hidden>
  <button class="btn" id="bNew">＋ 新規</button>
  <button class="btn" id="bSample">サンプル</button>
  <button class="btn" id="bUndo" title="元に戻す (Ctrl+Z)">↶</button>
  <button class="btn" id="bRedo" title="やり直す (Ctrl+Y)">↷</button>
  <div class="seg" id="tabs"><button data-v="studio">⌨ キーボード</button><button data-v="detail">🔬 くわしく</button></div>
  <span class="grow"></span>
  <input id="q" placeholder="🔍 キー・出力・コードを検索">
  <div class="seg" id="lay"><button data-l="jis">JIS</button><button data-l="us">US</button></div>
  <button class="btn" id="bExport">💾 書き出し</button>
</header>
<div class="app">
  <aside id="tree"></aside>
  <main id="main"></main>
  <section id="detail"></section>
</div>
<div id="drop">ここに .ahk ファイルをドロップして開く</div>
<dialog id="xdlg"></dialog>
<dialog id="udlg"></dialog>
<!-- BUILD:SCRIPTS -->
<script src="js/state.js"></script>
<script src="js/keys.js"></script>
<script src="js/parser.js"></script>
<script src="js/meaning.js"></script>
<script src="js/model.js"></script>
<script src="js/derive.js"></script>
<script src="js/resolve.js"></script>
<script src="js/palette.js"></script>
<script src="js/diff.js"></script>
<script src="js/sample.js"></script>
<script src="js/view-detail.js"></script>
<script src="js/view-studio.js"></script>
<script src="js/app.js"></script>
<!-- /BUILD:SCRIPTS -->
</body>
</html>
